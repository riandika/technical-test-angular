<main class="min-h-screen bg-davara-bg p-4 sm:p-5">
    <div
        class="mx-auto grid min-h-[calc(100vh-2rem)] max-w-full md:max-w-7xl overflow-auto rounded-4xl bg-davara-surface shadow-[0_20px_60px_rgba(24,24,27,0.06)] md:h-[calc(100vh-2.5rem)] md:min-h-0 md:grid-cols-[0.9fr_1.1fr]">

        <section class="flex flex-col px-6 py-7 sm:px-10 md:px-12 md:py-6">

            <header class="shrink-0">
                <a routerLink="/"
                    class="inline-flex cursor-pointer items-center text-lg font-bold tracking-[0.22em] text-davara-foreground">
                    DAVARA
                </a>
            </header>

            <div class="w-full md:max-w-md py-8 md:my-auto md:py-6">

                <div class="mb-6">
                    <p class="mb-2 text-xs font-bold uppercase tracking-[0.18em] text-davara-primary">
                        Welcome back
                    </p>

                    <h1
                        class="text-3xl font-semibold leading-tight tracking-[-0.04em] text-davara-foreground sm:text-4xl">
                        Sign in to your
                        <span class="block">Davara account.</span>
                    </h1>

                    <p class="mt-3 max-w-sm text-sm leading-5 text-davara-muted">
                        Continue exploring thoughtfully selected products for your everyday
                        life.
                    </p>
                </div>

                <form class="space-y-4">

                    <div>
                        <label for="email" class="mb-1.5 block text-sm font-semibold text-davara-foreground">
                            Email address
                        </label>

                        <input id="email" type="email" placeholder="you@example.com"
                            class="h-11 w-full rounded-xl border border-davara-border bg-davara-bg px-4 text-sm text-davara-foreground outline-none transition placeholder:text-zinc-400 focus:border-davara-primary focus:ring-4 focus:ring-davara-accent" />
                    </div>

                    <div>
                        <div class="mb-1.5 flex items-center justify-between">
                            <label for="password" class="text-sm font-semibold text-davara-foreground">
                                Password
                            </label>

                            <button type="button"
                                class="cursor-pointer text-xs font-semibold text-davara-primary transition hover:text-davara-primary-hover">
                                Forgot password?
                            </button>
                        </div>

                        <div class="relative">
                            <input id="password" [type]="showPassword() ? 'text' : 'password'"
                                placeholder="Enter your password"
                                class="h-11 w-full rounded-xl border border-davara-border bg-davara-bg px-4 pr-16 text-sm text-davara-foreground outline-none transition placeholder:text-zinc-400 focus:border-davara-primary focus:ring-4 focus:ring-davara-accent" />

                            <button type="button" (click)="togglePassword()"
                                [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
                                class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-xs font-semibold text-davara-muted transition hover:text-davara-foreground">
                                {{ showPassword() ? 'Hide' : 'Show' }}
                            </button>
                        </div>
                    </div>

                    <button type="submit"
                        class="h-11 w-full cursor-pointer rounded-xl bg-davara-primary px-5 text-sm font-bold text-white transition hover:bg-davara-primary-hover active:scale-[0.99]">
                        Sign in
                    </button>
                </form>

                <p class="mt-5 text-center text-sm text-davara-muted">
                    Don't have an account?
                    <button type="button"
                        class="cursor-pointer font-bold text-davara-foreground underline decoration-davara-primary underline-offset-4">
                        Create one
                    </button>
                </p>
            </div>

            <footer class="mt-auto pt-1 text-xs text-davara-muted">
                © 2026 Davara. Thoughtfully selected.
            </footer>
        </section>

        <aside class="relative hidden min-h-0 overflow-hidden bg-[#E9E3D8] md:block">
            <img src="/images/davara-login.jpeg" alt="Davara editorial product collection"
                class="absolute inset-0 h-full w-full object-cover" />

            <div class="absolute inset-0 bg-black/10"></div>

            <div class="absolute left-8 top-8">
                <span
                    class="rounded-full bg-white/85 px-3.5 py-1.5 text-[10px] font-bold uppercase tracking-[0.16em] text-davara-foreground backdrop-blur-sm">
                    Davara Shop
                </span>
            </div>

            <div class="absolute bottom-8 left-8 right-8">
                <div class="max-w-sm rounded-2xl bg-white/90 p-5 backdrop-blur-md">
                    <p class="text-[10px] font-bold uppercase tracking-[0.16em] text-davara-primary">
                        Everyday, considered
                    </p>

                    <h2 class="mt-2 text-2xl font-semibold leading-tight tracking-[-0.03em] text-davara-foreground">
                        Simple things,
                        <span class="block">chosen well.</span>
                    </h2>
                </div>
            </div>
        </aside>

    </div>
</main>
